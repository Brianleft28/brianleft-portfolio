<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Portfolio">
  <!--
    Maletín (portfolio) con un prompt de terminal adentro. La pestaña superior
    hace de asa y también lee como carpeta, en línea con el filesystem virtual.

    Poco detalle a propósito: se probó una versión con banda de cierre y trazos
    finos que a 16px —el tamaño real de la pestaña del navegador— se empastaba.
    Con el `>_` grande y sin banda sigue siendo legible.
  -->
  <rect width="64" height="64" rx="14" fill="#0d1117"/>

  <!-- Asa -->
  <path d="M24 17c0-2.2 1.8-4 4-4h8c2.2 0 4 1.8 4 4v5h-5v-4a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v4h-5z"
        fill="#4ec9b0"/>

  <!-- Cuerpo -->
  <rect x="9" y="22" width="46" height="30" rx="5" fill="#4ec9b0"/>

  <!-- Prompt: >_ -->
  <path d="M20 31l7 6-7 6" fill="none" stroke="#0d1117" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M33 43h12" fill="none" stroke="#0d1117" stroke-width="5" stroke-linecap="round"/>
</svg>
